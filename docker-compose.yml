# Chạy cả 3 thành phần: docker compose up --build
#   Frontend : http://localhost:3000
#   Backend  : http://localhost:4000
#   Postgres : localhost:5432 (brewlite / brewlite)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite
      POSTGRES_DB: brewlite
    ports:
      - "5432:5432"
    volumes:
      - brewlite-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://brewlite:brewlite@db:5432/brewlite?schema=public
      JWT_SECRET: doi-thanh-chuoi-bi-mat-dai-va-ngau-nhien
      JWT_EXPIRES_IN: 7d
      PORT: "4000"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend/my-app
      args:
        # Trình duyệt gọi trực tiếp backend nên dùng địa chỉ localhost
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  brewlite-db:
