<title id="t">Activity-01b – Thanh toán và xác nhận đơn hàng</title><desc id="d">Sơ đồ hoạt động swimlane: thanh toán với Idempotency-Key, cổng thanh toán mô phỏng, thành công hoặc thất bại và thử lại.</desc>
