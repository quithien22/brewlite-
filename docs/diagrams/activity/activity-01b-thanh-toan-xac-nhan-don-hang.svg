<text x="441" y="23.0" text-anchor="middle" font-weight="bold" font-size="17.5">Activity-01b – Thanh toán và xác nhận đơn hàng</text><rect x="23" y="28" width="854" height="34" fill="#EAF0F4"/><rect x="23" y="28" width="854" height="929" fill="none" stroke="#555" stroke-width="1.5"/><line x1="23" y1="62" x2="877" y2="62" stroke="#555" stroke-width="1.5"/><text text-anchor="middle" font-size="15" font-weight="bold"><tspan x="129.5" y="50.2">Khách hàng</tspan></text><line x1="236" y1="28" x2="236" y2="957" stroke="#555" stroke-width="1.5"/><text text-anchor="middle" font-size="15" font-weight="bold"><tspan x="342.5" y="50.2">Giao diện (Next.js)</tspan></text><line x1="449" y1="28" x2="449" y2="957" stroke="#555" stroke-width="1.5"/><text text-anchor="middle" font-size="15" font-weight="bold"><tspan x="555.5" y="50.2">API (NestJS + PostgreSQL)</tspan></text><line x1="662" y1="28" x2="662" y2="957" stroke="#555" stroke-width="1.5"/><text text-anchor="middle" font-size="15" font-weight="bold"><tspan x="769.5" y="50.2">Cổng thanh toán</tspan></text><g class="nodes"><circle class="start" cx="129" cy="89" r="9.5" fill="#000"/><g class="action"><rect x="36.0" y="120.0" width="188" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="130" y="143.6">Xem trang thanh toán,</tspan><tspan x="130" y="159.7">chọn Ví hoặc Thẻ</tspan></text></g><g class="action"><rect x="247.5" y="120.0" width="189" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="342" y="143.6">Sinh Idempotency-Key,</tspan><tspan x="342" y="159.7">POST /payments</tspan></text></g><g class="action"><rect x="459.5" y="120.0" width="191" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="555" y="143.6">Xác thực JWT; kiểm tra</tspan><tspan x="555" y="159.7">đơn của khách, chờ TT</tspan></text></g><g class="decision"><polygon points="555,202 627,233 555,264 483,233" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5"><tspan x="555" y="237.4">Hợp lệ?</tspan></text></g><g class="action"><rect x="247.5" y="205.5" width="189" height="55" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="342" y="229.6">Báo lỗi</tspan><tspan x="342" y="245.7">401 / 404 / 409 / 400</tspan></text></g><g class="flow-final"><circle cx="129" cy="233" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/><path d="M122.0,226.0 L136.0,240.0 M122.0,240.0 L136.0,226.0" stroke="#000" stroke-width="1.5"/></g><g class="decision"><polygon points="555,285 646,320 555,355 464,320" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5"><tspan x="555" y="317.0">Idempotency-Key</tspan><tspan x="555" y="331.8">đã tồn tại?</tspan></text></g><g class="action"><rect x="247.5" y="292.5" width="189" height="55" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="342" y="316.6">Hiển thị kết quả đã lưu</tspan><tspan x="342" y="332.7">(replayed = true)</tspan></text></g><g class="end"><circle cx="129" cy="320" r="11" fill="#fff" stroke="#000" stroke-width="2.0"/><circle cx="129" cy="320" r="7" fill="#000"/></g><g class="action"><rect x="459.0" y="389.0" width="192" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="555" y="412.6">Lưu Payment PROCESSING</tspan><tspan x="555" y="428.7">(key duy nhất); gọi cổng</tspan></text></g><g class="action"><rect x="674.0" y="389.0" width="188" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="768" y="412.6">Xử lý giao dịch</tspan><tspan x="768" y="428.7">mô phỏng Ví / Thẻ</tspan></text></g><g class="decision"><polygon points="555,471 637,507 555,543 473,507" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5"><tspan x="555" y="504.0">Cổng trả</tspan><tspan x="555" y="518.8">thành công?</tspan></text></g><g class="action"><rect x="450.0" y="576.0" width="210" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="555" y="599.6">Transaction: Payment SUCCESS,</tspan><tspan x="555" y="615.7">Order PAID, cộng điểm, ghi log</tspan></text></g><g class="action"><rect x="247.5" y="576.0" width="189" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="342" y="599.6">Xóa giỏ hàng, hiển thị</tspan><tspan x="342" y="615.7">thanh toán thành công</tspan></text></g><g class="action"><rect x="36.0" y="576.0" width="188" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="130" y="599.6">Nhận xác nhận</tspan><tspan x="130" y="615.7">(mã đơn, mã giao dịch)</tspan></text></g><g class="end"><circle cx="129" cy="669" r="11" fill="#fff" stroke="#000" stroke-width="2.0"/><circle cx="129" cy="669" r="7" fill="#000"/></g><g class="action"><rect x="450.0" y="706.0" width="210" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="555" y="729.6">Payment FAILED;</tspan><tspan x="555" y="745.7">Order PAYMENT_FAILED; ghi log</tspan></text></g><g class="action"><rect x="247.5" y="706.0" width="189" height="54" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="13.2"><tspan x="342" y="729.6">Hiển thị lỗi, nút</tspan><tspan x="342" y="745.7">Thử lại / Hủy đơn</tspan></text></g><g class="decision"><polygon points="129,702 201,732 129,762 57,732" fill="#fff" stroke="#000" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5"><t